<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="bandera-title bandera-desc">
  <title id="bandera-title">Bandera de la Avanzada Lankuyen · imagen de referencia</title>
  <desc id="bandera-desc">Paño blanco con franjas añil, una cumbre de tres montañas y una estrella dorada. Marcador de posición hasta que los Adultos Acompañantes suban la fotografía oficial.</desc>
